name: Release

# Push a tag like v0.3.0 (or v0.3.0-beta.1 for a pre-release) to build and publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller==6.16.0

      - name: Test
        run: python -m pytest -q

      - name: Build app
        shell: pwsh
        run: |
          # Stamp the tag's version into the app, so tester logs say which build crashed.
          Set-Content echoline/__init__.py "__version__ = '$("${{ github.ref_name }}".TrimStart("v"))'"
          python -m PyInstaller packaging/echoline.spec --noconfirm --distpath build/dist --workpath build/work

      - name: Build installer and portable zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "build\installer\EchoLine-Setup-$version.exe" release\
          # A stable name, so the website can always link to releases/latest/download/EchoLine-Setup.exe
          Copy-Item "build\installer\EchoLine-Setup-$version.exe" release\EchoLine-Setup.exe
          Compress-Archive -Path build\dist\EchoLine -DestinationPath "release\EchoLine-$version-portable.zip"
          Get-ChildItem release -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content release\SHA256SUMS.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $pre = if ($tag.Contains("-")) { "--prerelease" } else { "" }
          gh release create $tag (Get-ChildItem release -File).FullName --title "EchoLine $($tag.TrimStart('v'))" --generate-notes $pre
